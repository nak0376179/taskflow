[project]
name = "taskflow-backend"
version = "0.1.0"
description = "TaskFlow backend: REST (FastAPI) + MCP (FastMCP) on Cognito / DynamoDB"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.108",
    "fastapi>=0.142.2",
    "fastmcp>=4.0.10",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto[cognitoidp,dynamodb]>=5.2.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 長さは formatter に任せる (文字列は折らない)
